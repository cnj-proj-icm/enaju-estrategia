    peso: 1
    termos:
      - aprimorar
      - fortalecer
      - desenvolver
      - qualificar

tipos_gap:
  explicito:
    regra: "contem termo do grupo A e contexto relacionado a capacidade, competencia, processo ou servico"
  implicito:
    regra: "contem sinal organizacional do grupo C com potencial de desenvolvimento institucional"
  potencial:
    regra: "contem termo tematico ou formativo, mas exige revisao humana para confirmar a lacuna"

eixos:
  dados_e_tecnologia:
    termos: [dados, datajud, saneamento, analitica, automacao, inteligencia artificial]
  gestao_e_governanca:
    termos: [gestao, governanca, protocolo, fluxo, padronizacao, institucionalizacao]
  formacao_de_liderancas:
    termos: [lideranca, liderancas, gerencial, chefia, gestor, gestores]
  saude_e_bem_estar:
    termos: [saude mental, saude, bem-estar, adoecimento, qualidade de vida]
  direitos_humanos_e_inclusao:
    termos: [direitos humanos, discriminacao, equidade, racial, genero, violencia, assedio]
  atendimento_e_servicos_judiciarios:
    termos: [atendimento, servico, jurisdicionado, acesso a justica, prestacao jurisdicional]
  inovacao_e_transformacao:
    termos: [inovacao, laboratorio, transformacao digital, ia generativa]
  avaliacao_e_monitoramento:
    termos: [avaliacao, monitoramento, indicador, indicadores, cobertura]
  comunicacao_e_acessibilidade:
    termos: [comunicacao, acessibilidade, linguagem simples, pessoas com deficiencia]
  equipes_multidisciplinares:
    termos: [equipe multidisciplinar, equipes multidisciplinares, equipe reduzida, pessoal]

hipoteses_competencia:
  - gatilhos: [saneamento de dados, qualidade dos dados, datajud]
    hipotese: governanca e qualidade de dados
  - gatilhos: [assedio, discriminacao, fluxo, protocolo]
    hipotese: prevencao, acolhimento e encaminhamento institucional
  - gatilhos: [inovacao, laboratorio, transformacao digital]
    hipotese: gestao da inovacao e transformacao organizacional
  - gatilhos: [acessibilidade, pessoas com deficiencia, comunicacao]
    hipotese: acessibilidade e comunicacao inclusiva
  - gatilhos: [equipe multidisciplinar, equipes multidisciplinares, equipe reduzida]
    hipotese: estruturacao e atuacao de equipes multidisciplinares
