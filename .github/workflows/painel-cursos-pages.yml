name: Publicar Painel de Cursos

on:
  push:
    branches: [main]
    paths:
      - "painel-cursos/**"
      - ".github/workflows/painel-cursos-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "painel-cursos"

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
