name: Publicar site da ENAJU

on:
  push:
    branches: [main]
    paths:
      - "painel-cursos/**"
      - "governanca/**"
      - ".github/workflows/painel-cursos-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Montar site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -r painel-cursos/. _site/
          if [ -d governanca ]; then
            mkdir -p _site/governanca
            cp -r governanca/. _site/governanca/
          fi
          find _site -maxdepth 2 -type f -name "*.html" | sort

      - name: Preparar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
